
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Status Bar Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Favicon -->
    <link rel="icon" href="/favicon.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="/favicon.jpg">
    
    <!-- SEO Meta Tags -->
    <title>ellocontent — IA para Criação de Conteúdo</title>
    <meta name="description" content="Crie carrosséis, posts e conteúdos para redes sociais com inteligência artificial. Software de IA para criadores e marcas." />
    <meta name="keywords" content="IA, inteligência artificial, conteúdo, carrossel, posts, redes sociais, criação de conteúdo, ellocontent" />
    <meta name="author" content="ellocontent" />
    <meta name="robots" content="index, follow" />
    
    <!-- Theme Color for Mobile / PWA -->
    <meta name="theme-color" content="#3000E3" />
    <meta name="msapplication-TileColor" content="#3000E3" />
    <meta name="msapplication-navbutton-color" content="#3000E3" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ellocontent.com/" />
    <meta property="og:title" content="ellocontent — IA para Criação de Conteúdo" />
    <meta property="og:description" content="Crie carrosséis, posts e conteúdos para redes sociais com inteligência artificial. Software de IA para criadores e marcas." />
    <meta property="og:image" content="/favicon.jpg" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="ellocontent" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://ellocontent.com/" />
    <meta name="twitter:title" content="ellocontent — IA para Criação de Conteúdo" />
    <meta name="twitter:description" content="Crie carrosséis, posts e conteúdos para redes sociais com inteligência artificial." />
    <meta name="twitter:image" content="/favicon.jpg" />
    <meta name="twitter:site" content="@ellocontent" />
    <meta name="twitter:creator" content="@ellocontent" />
    
    <!-- Additional SEO -->
    <meta name="language" content="Portuguese" />
    <meta name="revisit-after" content="7 days" />
    <meta name="distribution" content="web" />
    <meta name="rating" content="general" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ellocontent",
      "description": "Software de IA para criação de conteúdos para redes sociais — carrosséis, posts e mais.",
      "url": "https://ellocontent.com",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "category": "AI Content Creation Software"
      },
      "author": {
        "@type": "Organization",
        "name": "ellocontent"
      }
    }
    </script>
    
    <!-- OneSignal Web Push SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    
    <!-- Custom CSS for safe area -->
    <style>
      html, body {
        background-color: #3000E3;
        margin: 0;
        padding: 0;
        transition: background-color 0.3s ease;
      }
      
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      
      #root {
        background-color: hsl(0 0% 100%);
        min-height: 100vh;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <footer id="static-policy-footer" style="text-align:center;padding:24px;font-family:sans-serif;font-size:14px;color:#666;background:#fff;">
      <a href="https://www.ellosuit.online/privacy" style="color:#3000E3;text-decoration:underline;margin-right:16px;">Política de Privacidade</a>
      <a href="https://www.ellosuit.online/terms" style="color:#3000E3;text-decoration:underline;">Termos de Serviço</a>
    </footer>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide static footer once React app mounts
      var observer = new MutationObserver(function() {
        if (document.getElementById('root') && document.getElementById('root').children.length > 0) {
          var f = document.getElementById('static-policy-footer');
          if (f) f.style.display = 'none';
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
    </script>
  </body>
</html>
